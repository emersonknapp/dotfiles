---
- name: Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Pop!_OS (and other Ubuntu derivatives) set UBUNTU_CODENAME to the upstream
# Ubuntu release, which is what upstream apt repos expect. Fall back to
# VERSION_CODENAME when UBUNTU_CODENAME is absent.
- name: Resolve Ubuntu codename for apt repos
  ansible.builtin.shell: |
    set -o pipefail
    . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
  args:
    executable: /bin/bash
  register: ubuntu_codename
  changed_when: false

# Insync serves an ASCII-armored key; apt reads it directly from a .asc file,
# so no gpg --dearmor step is needed.
- name: Download Insync GPG key
  become: true
  ansible.builtin.get_url:
    url: https://apt.insync.io/insynchq.gpg
    dest: /etc/apt/keyrings/insynchq.asc
    mode: "0644"

# Insync builds against Ubuntu; use the ubuntu channel on Pop!_OS and other
# derivatives.
- name: Add Insync apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: insync
    types: [deb]
    uris: http://apt.insync.io/ubuntu
    suites: ["{{ ubuntu_codename.stdout }}"]
    components: [non-free, contrib]
    signed_by: /etc/apt/keyrings/insynchq.asc
    state: present

- name: Install Insync
  become: true
  ansible.builtin.apt:
    name: insync
    state: latest
    update_cache: true

# Use Vivaldi's apt repo rather than a pinned .deb so the browser stays current
# through normal apt upgrades. The signing key is ASCII-armored (.pub), so apt
# reads it directly from a .asc file. The repo suite is the literal "stable",
# not the Ubuntu codename.
- name: Download Vivaldi GPG key
  become: true
  ansible.builtin.get_url:
    url: https://repo.vivaldi.com/stable/linux_signing_key.pub
    dest: /etc/apt/keyrings/vivaldi.asc
    mode: "0644"

- name: Add Vivaldi apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: vivaldi
    types: [deb]
    uris: https://repo.vivaldi.com/archive/deb/
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/vivaldi.asc
    state: present

- name: Install Vivaldi
  become: true
  ansible.builtin.apt:
    name: vivaldi-stable
    state: latest
    update_cache: true

# Microsoft serves an ASCII-armored key; apt reads it directly from a .asc
# file, so no gpg --dearmor step is needed.
- name: Download Microsoft GPG key
  become: true
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"

- name: Add VS Code apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: https://packages.microsoft.com/repos/code
    suites: [stable]
    components: [main]
    architectures: [amd64, arm64, armhf]
    signed_by: /etc/apt/keyrings/microsoft.asc
    state: present

- name: Install VS Code
  become: true
  ansible.builtin.apt:
    name: code
    state: latest
    update_cache: true

# Regolith is an alternate desktop, selectable at the login screen alongside
# the default. The key is ASCII-armored, so apt reads it from a .asc file. The
# repo component is the Regolith release version (bump it to move releases);
# the suite is the Ubuntu codename.
- name: Download Regolith GPG key
  become: true
  ansible.builtin.get_url:
    url: https://archive.regolith-desktop.com/regolith.key
    dest: /etc/apt/keyrings/regolith-archive-keyring.asc
    mode: "0644"

- name: Add Regolith apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: regolith
    types: [deb]
    uris: https://archive.regolith-desktop.com/ubuntu/stable
    suites: ["{{ ubuntu_codename.stdout }}"]
    components: [v3.4]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/regolith-archive-keyring.asc
    state: present

- name: Install Regolith desktop
  become: true
  ansible.builtin.apt:
    name:
      - regolith-desktop
      - regolith-session-flashback
      - regolith-look-lascaille
      - xdg-desktop-portal-regolith
    state: latest
    update_cache: true

# 1Password serves an ASCII-armored key; apt reads it directly from a .asc
# file. The debsig-verify path below is separate and does need a dearmored
# (binary) keyring, hence gnupg.
- name: Install 1Password prerequisites
  become: true
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true

- name: Download 1Password apt GPG key
  become: true
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /etc/apt/keyrings/1password-archive-keyring.asc
    mode: "0644"

- name: Add 1Password apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: 1password
    types: [deb]
    uris: https://downloads.1password.com/linux/debian/amd64
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/1password-archive-keyring.asc
    state: present

# debsig-verify checks the .deb package signature. 1Password ships a policy and
# a dedicated keyring under fixed, fingerprint-named paths.
- name: Create 1Password debsig policy directory
  become: true
  ansible.builtin.file:
    path: /etc/debsig/policies/AC2D62742012EA22
    state: directory
    mode: "0755"

- name: Install 1Password debsig policy
  become: true
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/debian/debsig/1password.pol
    dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
    mode: "0644"

- name: Create 1Password debsig keyring directory
  become: true
  ansible.builtin.file:
    path: /usr/share/debsig/keyrings/AC2D62742012EA22
    state: directory
    mode: "0755"

- name: Download 1Password debsig key
  become: true
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /usr/share/debsig/keyrings/AC2D62742012EA22/1password.asc
    mode: "0644"

- name: Dearmor 1Password debsig keyring
  become: true
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output debsig.gpg 1password.asc
    chdir: /usr/share/debsig/keyrings/AC2D62742012EA22
    creates: /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg

- name: Install 1Password
  become: true
  ansible.builtin.apt:
    name: 1password
    state: latest
    update_cache: true
