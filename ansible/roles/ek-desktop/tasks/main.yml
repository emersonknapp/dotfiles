---
- name: Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Pop!_OS (and other Ubuntu derivatives) set UBUNTU_CODENAME to the upstream
# Ubuntu release, which is what upstream apt repos expect. Fall back to
# VERSION_CODENAME when UBUNTU_CODENAME is absent.
- name: Resolve Ubuntu codename for apt repos
  ansible.builtin.shell: |
    set -o pipefail
    . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
  args:
    executable: /bin/bash
  register: ubuntu_codename
  changed_when: false

# Insync serves an ASCII-armored key; apt reads it directly from a .asc file,
# so no gpg --dearmor step is needed.
- name: Download Insync GPG key
  become: true
  ansible.builtin.get_url:
    url: https://apt.insync.io/insynchq.gpg
    dest: /etc/apt/keyrings/insynchq.asc
    mode: "0644"

# Insync builds against Ubuntu; use the ubuntu channel on Pop!_OS and other
# derivatives.
- name: Add Insync apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: insync
    types: [deb]
    uris: http://apt.insync.io/ubuntu
    suites: ["{{ ubuntu_codename.stdout }}"]
    components: [non-free, contrib]
    signed_by: /etc/apt/keyrings/insynchq.asc
    state: present

- name: Install Insync
  become: true
  ansible.builtin.apt:
    name: insync
    state: present
    update_cache: true

# Use Vivaldi's apt repo rather than a pinned .deb so the browser stays current
# through normal apt upgrades. The signing key is ASCII-armored (.pub), so apt
# reads it directly from a .asc file. The repo suite is the literal "stable",
# not the Ubuntu codename.
- name: Download Vivaldi GPG key
  become: true
  ansible.builtin.get_url:
    url: https://repo.vivaldi.com/stable/linux_signing_key.pub
    dest: /etc/apt/keyrings/vivaldi.asc
    mode: "0644"

- name: Add Vivaldi apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: vivaldi
    types: [deb]
    uris: https://repo.vivaldi.com/archive/deb/
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/vivaldi.asc
    state: present

- name: Install Vivaldi
  become: true
  ansible.builtin.apt:
    name: vivaldi-stable
    state: present
    update_cache: true

# Microsoft serves an ASCII-armored key; apt reads it directly from a .asc
# file, so no gpg --dearmor step is needed.
- name: Download Microsoft GPG key
  become: true
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"

- name: Add VS Code apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: https://packages.microsoft.com/repos/code
    suites: [stable]
    components: [main]
    architectures: [amd64, arm64, armhf]
    signed_by: /etc/apt/keyrings/microsoft.asc
    state: present

- name: Install VS Code
  become: true
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true

# Regolith is an alternate desktop, selectable at the login screen alongside
# the default. The key is ASCII-armored, so apt reads it from a .asc file. The
# repo component is the Regolith release version (bump it to move releases);
# the suite is the Ubuntu codename.
- name: Download Regolith GPG key
  become: true
  ansible.builtin.get_url:
    url: https://archive.regolith-desktop.com/regolith.key
    dest: /etc/apt/keyrings/regolith-archive-keyring.asc
    mode: "0644"

- name: Add Regolith apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: regolith
    types: [deb]
    uris: https://archive.regolith-desktop.com/ubuntu/stable
    suites: ["{{ ubuntu_codename.stdout }}"]
    components: [v3.4]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/regolith-archive-keyring.asc
    state: present

- name: Install Regolith desktop
  become: true
  ansible.builtin.apt:
    name:
      - regolith-desktop
      - regolith-session-flashback
      - regolith-look-lascaille
      - xdg-desktop-portal-regolith
    state: present
    update_cache: true
