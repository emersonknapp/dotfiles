---

- name: Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Upstream apt repos expect UBUNTU_CODENAME variable.
# Set it explicitly for Pop!_OS compatibility.
- name: Resolve Ubuntu codename for apt repos
  ansible.builtin.shell: |
    set -o pipefail
    . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
  args:
    executable: /bin/bash
  register: ubuntu_codename
  changed_when: false

- ansible.builtin.import_tasks: insync.yml
- ansible.builtin.import_tasks: vivaldi.yml
- ansible.builtin.import_tasks: vscode.yml
- ansible.builtin.import_tasks: regolith.yml
- ansible.builtin.import_tasks: 1password.yml
