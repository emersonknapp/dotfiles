---
# Regolith is an alternate desktop, selectable at the login screen alongside the default.
# The key is ASCII-armored, so apt reads it from a .asc file.
# The repo component is the Regolith release version, bump it to move releases.
# The suite is the Ubuntu codename.
- name: Download Regolith GPG key
  become: true
  ansible.builtin.get_url:
    url: https://archive.regolith-desktop.com/regolith.key
    dest: /etc/apt/keyrings/regolith-archive-keyring.asc
    mode: "0644"

- name: Add Regolith apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: regolith
    types: [deb]
    uris: https://archive.regolith-desktop.com/ubuntu/stable
    suites: ["{{ ubuntu_codename.stdout }}"]
    components: [v3.4]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/regolith-archive-keyring.asc
    state: present

- name: Install Regolith desktop
  become: true
  ansible.builtin.apt:
    name:
      - regolith-desktop
      - regolith-session-flashback
      - regolith-look-lascaille
      - xdg-desktop-portal-regolith
    state: latest
    update_cache: true
