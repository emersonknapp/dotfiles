---
- name: Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Upstream apt repos expect the UBUNTU_CODENAME variable.
# Resolve it from /etc/os-release, falling back to VERSION_CODENAME when absent.
- name: Resolve Ubuntu codename for apt repos
  ansible.builtin.shell: |
    set -o pipefail
    . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
  args:
    executable: /bin/bash
  register: ubuntu_codename
  changed_when: false

- ansible.builtin.import_tasks: mkvtoolnix.yml
- ansible.builtin.import_tasks: obs.yml
