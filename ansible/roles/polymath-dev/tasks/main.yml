---
- name: Install prerequisite packages
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Determine dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_architecture
  changed_when: false

# Upstream apt repos expect the UBUNTU_CODENAME variable.
# Resolve it from /etc/os-release, falling back to VERSION_CODENAME when absent.
- name: Resolve Ubuntu codename for apt repos
  ansible.builtin.shell: |
    set -o pipefail
    . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
  args:
    executable: /bin/bash
  register: ubuntu_codename
  changed_when: false

- ansible.builtin.import_tasks: direnv.yml
- ansible.builtin.import_tasks: docker.yml
- ansible.builtin.import_tasks: github-cli.yml
- ansible.builtin.import_tasks: vagrant.yml
- ansible.builtin.import_tasks: kubectl.yml
- ansible.builtin.import_tasks: tailscale.yml
