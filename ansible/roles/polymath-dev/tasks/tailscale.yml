---
# Tailscale ships the key pre-dearmored (noarmor.gpg), so store it as .gpg and use as-is.
# The key is served per Ubuntu codename.
- name: Download Tailscale GPG key
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ubuntu_codename.stdout }}.noarmor.gpg"
    dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: ["{{ ubuntu_codename.stdout }}"]
    components: [main]
    signed_by: /etc/apt/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Install Tailscale
  become: true
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
